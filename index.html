<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Household ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/gate.css">
</head>
<body>
<nav class="side" id="side" aria-label="Main">
  <div class="side-brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Household ledger</span></div>
  <button class="nav" data-nav="bank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Bank account</span></button>
  <button class="nav" data-nav="cards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M7 15h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Cards</span></button>
  <button class="nav" data-nav="upload" id="uploadBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Upload</span><em class="nbadge" id="uploadBadge" hidden></em></button>
  <button class="nav" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Settings</span></button>
  <p class="side-status" id="sideStatus"></p>
</nav>
<div class="shell">
<div class="top">
  <div class="wrap">
    <div class="bar1">
      <button class="iconbtn" id="backBtn" data-layer="bank" hidden aria-label="Back to bank account"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="brand"><span id="title">Bank account</span><small id="storeStatus">Loading…</small></div>

    </div>
    <nav class="tabs" id="tabs" aria-label="Card views"></nav>
    <div class="strip" id="strip" hidden></div>
    <div class="abar" id="abar"></div>
  </div>
</div>
<div class="wrap">
  <div class="frow" id="frow"></div>
  <main id="main"><div class="empty">Loading your ledger…</div></main>
</div>
</div>
<input type="file" id="fileIn" multiple hidden accept=".xlsx,.xls,.csv,.pdf,image/*">

<script src="config.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/drive-db.js"></script>
<script src="js/pdf-reader.js"></script>
<script src="js/app.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
